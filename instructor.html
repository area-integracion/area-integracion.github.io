<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis asesorías · Área de Integración</title><link rel="stylesheet" href="instructor.css?v=20261112-2"><link rel="icon" href="img/favicon.png"></head><body><main><header><h1>Mis asesorías</h1><p>Área de Integración · Acceso personal</p></header><section id="auth"><h2>Ingresar</h2><p>Ingresa con tu DNI y clave personal.</p><form id="login"><label>DNI<input id="dni" inputmode="numeric" maxlength="8" required></label><label>Clave<input id="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section><section id="dashboard" hidden><div class="head"><h2 id="greeting">Mis asesorías</h2><button id="logout" type="button">Salir</button></div><nav class="tabs" role="tablist"><button type="button" data-tab="profile" class="active" aria-selected="true">MI PERFIL</button><button type="button" data-tab="bookings" aria-selected="false">ASESORÍAS CONFIRMADAS</button><button type="button" data-tab="requests" aria-selected="false">SOLICITUDES DE ASESORÍAS</button></nav><section class="tab-panel" data-panel="profile"><h3>Mi perfil y horarios de atención</h3><form id="profileForm"><label>Nombre<input id="profileName" required></label><label>Correo<input id="profileEmail" type="email"></label><label>Celular / WhatsApp<input id="profilePhone"></label><label>Duración de cada asesoría<select id="profileDuration"><option value="15">15 minutos</option><option value="30">30 minutos</option><option value="45">45 minutos</option><option value="60">60 minutos</option><option value="90">90 minutos</option></select></label><h3>Horarios disponibles</h3><div id="scheduleRows"></div><button type="button" class="secondary" id="addSchedule">+ Agregar horario</button><button type="submit">Guardar cambios</button><p id="profileMsg" role="status"></p></form></section><section class="tab-panel" data-panel="bookings" hidden><h3>Asesorías confirmadas</h3><div id="bookingList"></div></section><section class="tab-panel" data-panel="requests" hidden><h3>Solicitudes de asesorías</h3><div id="requestList"></div></section></section><p id="notice" role="status" aria-live="polite"></p><a href="index.html">Volver al inicio</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="instructor.js?v=20261112-2"></script></body></html>
